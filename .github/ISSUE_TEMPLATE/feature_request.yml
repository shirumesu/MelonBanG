name: 功能建议
description: 想要的新功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 现在哪里不方便，在什么场景下遇到的。
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 希望怎么做
      description: 你设想的做法；其他应用有类似功能的话，也可以附上截图。
  - type: textarea
    id: context
    attributes:
      label: 补充信息
