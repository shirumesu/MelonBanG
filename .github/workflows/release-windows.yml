name: Release Windows

# A pushed v* tag builds the release files and opens a draft GitHub release;
# publishing that draft makes it visible to the in-app updater. A manual run
# builds the same files as a workflow artifact without releasing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - name: Check tag and version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = (Select-String -LiteralPath 'pubspec.yaml' -Pattern '^version:\s*([^+\s]+)').Matches[0].Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match pubspec version $version."
          }
      - name: Verify Dart code
        shell: pwsh
        run: |
          flutter pub get
          if ($LASTEXITCODE -ne 0) { throw 'Dependency resolution failed.' }
          flutter analyze
          if ($LASTEXITCODE -ne 0) { throw 'Analysis failed.' }
          Push-Location installer
          flutter pub get
          if ($LASTEXITCODE -ne 0) { throw 'Installer dependency resolution failed.' }
          flutter analyze
          if ($LASTEXITCODE -ne 0) { throw 'Installer analysis failed.' }
          Pop-Location
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y
      - name: Package
        shell: pwsh
        env:
          MELONBANG_SERVICES_JSON: ${{ secrets.MELONBANG_SERVICES_JSON }}
          MELONBANG_UPDATE_SIGNING_KEY: ${{ secrets.MELONBANG_UPDATE_SIGNING_KEY }}
        run: |
          foreach ($name in 'MELONBANG_SERVICES_JSON', 'MELONBANG_UPDATE_SIGNING_KEY') {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Set the $name repository secret."
            }
          }
          $configurationPath = Join-Path $env:RUNNER_TEMP 'melonbang-services.json'
          $keyPath = Join-Path $env:RUNNER_TEMP 'melonbang-update-signing.pem'
          try {
            [IO.File]::WriteAllText($configurationPath, $env:MELONBANG_SERVICES_JSON)
            [IO.File]::WriteAllText($keyPath, $env:MELONBANG_UPDATE_SIGNING_KEY)
            ./scripts/package.ps1 -ConfigurationFile $configurationPath -SigningKey $keyPath
          } finally {
            Remove-Item -LiteralPath $configurationPath, $keyPath -Force -ErrorAction SilentlyContinue
          }
      - name: Create draft release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $options = @('--draft', '--generate-notes', '--title', "MelonBanG $($env:GITHUB_REF_NAME.Substring(1))")
          if ($env:GITHUB_REF_NAME.Contains('-')) { $options += '--prerelease' }
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem dist).FullName @options
      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: melonbang-windows-x64
          path: dist/*
          compression-level: 0
          if-no-files-found: error
