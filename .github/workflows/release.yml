name: Release

# A pushed v* tag builds the release files for every platform and opens a
# draft GitHub release; publishing that draft makes it visible to the in-app
# updater. A manual run builds the same files as workflow artifacts without
# releasing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - name: Check tag and version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = (Select-String -LiteralPath 'pubspec.yaml' -Pattern '^version:\s*([^+\s]+)').Matches[0].Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match pubspec version $version."
          }
      - name: Verify Dart code
        shell: pwsh
        run: |
          flutter pub get
          if ($LASTEXITCODE -ne 0) { throw 'Dependency resolution failed.' }
          flutter analyze
          if ($LASTEXITCODE -ne 0) { throw 'Analysis failed.' }
          Push-Location installer
          flutter pub get
          if ($LASTEXITCODE -ne 0) { throw 'Installer dependency resolution failed.' }
          flutter analyze
          if ($LASTEXITCODE -ne 0) { throw 'Installer analysis failed.' }
          Pop-Location
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y
      # The release job signs the manifest once both platforms are in it.
      - name: Package
        shell: pwsh
        env:
          MELONBANG_SERVICES_JSON: ${{ secrets.MELONBANG_SERVICES_JSON }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MELONBANG_SERVICES_JSON)) {
            throw 'Set the MELONBANG_SERVICES_JSON repository secret.'
          }
          $configurationPath = Join-Path $env:RUNNER_TEMP 'melonbang-services.json'
          try {
            [IO.File]::WriteAllText($configurationPath, $env:MELONBANG_SERVICES_JSON)
            ./scripts/package.ps1 -ConfigurationFile $configurationPath
          } finally {
            Remove-Item -LiteralPath $configurationPath -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: melonbang-windows-x64
          path: dist/*
          compression-level: 0
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - name: Check tag and version
        if: github.ref_type == 'tag'
        run: |
          version=$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml)
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match pubspec version $version." >&2
            exit 1
          fi
      # The torrent bridge's build hook compiles OpenSSL and libtorrent.
      - name: Install native build tools
        run: brew install cmake ninja boost
      - name: Package
        env:
          MELONBANG_SERVICES_JSON: ${{ secrets.MELONBANG_SERVICES_JSON }}
        run: |
          if [[ -z "${MELONBANG_SERVICES_JSON//[[:space:]]/}" ]]; then
            echo 'Set the MELONBANG_SERVICES_JSON repository secret.' >&2
            exit 1
          fi
          configuration="$RUNNER_TEMP/melonbang-services.json"
          trap 'rm -f "$configuration"' EXIT
          printf '%s' "$MELONBANG_SERVICES_JSON" > "$configuration"
          scripts/package-macos.sh -c "$configuration"
      - uses: actions/upload-artifact@v4
        with:
          name: melonbang-macos-arm64
          path: dist/*
          compression-level: 0
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: parts
      - name: Sign the combined manifest
        env:
          MELONBANG_UPDATE_SIGNING_KEY: ${{ secrets.MELONBANG_UPDATE_SIGNING_KEY }}
        run: |
          if [[ -z "${MELONBANG_UPDATE_SIGNING_KEY//[[:space:]]/}" ]]; then
            echo 'Set the MELONBANG_UPDATE_SIGNING_KEY repository secret.' >&2
            exit 1
          fi
          mkdir dist
          find parts -type f ! -name 'manifest.json*' -exec cp {} dist/ \;
          jq -sc 'if (map(.version) | unique | length) == 1
            then {version: .[0].version, platforms: (map(.platforms) | add)}
            else error("platform manifests name different versions") end' \
            parts/*/manifest.json > dist/manifest.json
          key="$RUNNER_TEMP/melonbang-update-signing.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$MELONBANG_UPDATE_SIGNING_KEY" > "$key"
          openssl dgst -sha256 -sign "$key" -out dist/manifest.json.sig dist/manifest.json
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: |
            **macOS**：没有 Apple 开发者签名。把 MelonBanG 拖进“应用程序”后，第一次打开会提示无法打开，请到“系统设置 → 隐私与安全性”点“仍要打开”，或在终端运行 `xattr -dr com.apple.quarantine /Applications/MelonBanG.app`。每次更新后首次读取 Bangumi 或 PikPak 登录信息时，系统会请求访问钥匙串，选择“始终允许”即可。
        run: |
          options=(--draft --generate-notes --notes "$NOTES" --title "MelonBanG ${GITHUB_REF_NAME#v}")
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then options+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" "${options[@]}"
