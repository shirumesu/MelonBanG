name: Release

# A pushed v* tag builds the release files for every platform and opens a
# GitHub release whose notes are CHANGELOG.md. A prerelease (beta) is
# published at once; a stable release stays a draft until someone publishes
# it, which makes it visible to the in-app updater. A manual run builds the
# same files as workflow artifacts without releasing.
#
# A tag run restores only caches saved on master, not ones saved by another
# tag. ci.yml saves the Linux Flutter caches there; Windows and macOS do not
# cache Flutter, whose save took minutes and was never restored.
# native-cache.yml keeps the Windows native dependencies cached on master.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
      - name: Check tag and version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = (Select-String -LiteralPath 'pubspec.yaml' -Pattern '^version:\s*([^+\s]+)').Matches[0].Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match pubspec version $version."
          }
      - name: Verify Dart code
        shell: pwsh
        run: |
          flutter pub get
          if ($LASTEXITCODE -ne 0) { throw 'Dependency resolution failed.' }
          flutter analyze
          if ($LASTEXITCODE -ne 0) { throw 'Analysis failed.' }
          Push-Location installer
          flutter pub get
          if ($LASTEXITCODE -ne 0) { throw 'Installer dependency resolution failed.' }
          flutter analyze
          if ($LASTEXITCODE -ne 0) { throw 'Installer analysis failed.' }
          Pop-Location
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y
      # vcpkg's binary packages of libtorrent, Boost and OpenSSL, saved by
      # native-cache.yml; the newest one is restored, and vcpkg rebuilds only
      # ports whose ABI (sources, compiler) differs.
      - uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}\vcpkg
          key: vcpkg-${{ github.run_id }}
          restore-keys: vcpkg-
      # The release job signs the manifest once both platforms are in it.
      - name: Package
        shell: pwsh
        env:
          MELONBANG_SERVICES_JSON: ${{ secrets.MELONBANG_SERVICES_JSON }}
          VCPKG_BINARY_SOURCES: clear;files,${{ runner.temp }}\vcpkg,read
        run: |
          New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'vcpkg') | Out-Null
          if ([string]::IsNullOrWhiteSpace($env:MELONBANG_SERVICES_JSON)) {
            throw 'Set the MELONBANG_SERVICES_JSON repository secret.'
          }
          $configurationPath = Join-Path $env:RUNNER_TEMP 'melonbang-services.json'
          try {
            [IO.File]::WriteAllText($configurationPath, $env:MELONBANG_SERVICES_JSON)
            ./scripts/package.ps1 -ConfigurationFile $configurationPath
          } finally {
            Remove-Item -LiteralPath $configurationPath -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: melonbang-windows-x64
          path: dist/*
          compression-level: 0
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
      - name: Check tag and version
        if: github.ref_type == 'tag'
        run: |
          version=$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml)
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match pubspec version $version." >&2
            exit 1
          fi
      # The torrent bridge's build hook compiles OpenSSL and libtorrent.
      - name: Install native build tools
        run: brew install cmake ninja boost
      - name: Package
        env:
          MELONBANG_SERVICES_JSON: ${{ secrets.MELONBANG_SERVICES_JSON }}
        run: |
          if [[ -z "${MELONBANG_SERVICES_JSON//[[:space:]]/}" ]]; then
            echo 'Set the MELONBANG_SERVICES_JSON repository secret.' >&2
            exit 1
          fi
          configuration="$RUNNER_TEMP/melonbang-services.json"
          trap 'rm -f "$configuration"' EXIT
          printf '%s' "$MELONBANG_SERVICES_JSON" > "$configuration"
          scripts/package-macos.sh -c "$configuration"
      - uses: actions/upload-artifact@v4
        with:
          name: melonbang-macos-arm64
          path: dist/*
          compression-level: 0
          if-no-files-found: error

  linux:
    # The AppImage runs on distributions whose glibc is at least this one's.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - name: Check tag and version
        if: github.ref_type == 'tag'
        run: |
          version=$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml)
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match pubspec version $version." >&2
            exit 1
          fi
      # The torrent bridge's build hook compiles OpenSSL and libtorrent.
      - name: Install build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build pkg-config libgtk-3-dev \
            libmpv-dev libsecret-1-dev patchelf jq
      - name: Package
        env:
          MELONBANG_SERVICES_JSON: ${{ secrets.MELONBANG_SERVICES_JSON }}
        run: |
          if [[ -z "${MELONBANG_SERVICES_JSON//[[:space:]]/}" ]]; then
            echo 'Set the MELONBANG_SERVICES_JSON repository secret.' >&2
            exit 1
          fi
          configuration="$RUNNER_TEMP/melonbang-services.json"
          trap 'rm -f "$configuration"' EXIT
          printf '%s' "$MELONBANG_SERVICES_JSON" > "$configuration"
          scripts/package-linux.sh -c "$configuration"
      - uses: actions/upload-artifact@v4
        with:
          name: melonbang-linux-x64
          path: dist/*
          compression-level: 0
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          path: parts
      - name: Sign the combined manifest
        env:
          MELONBANG_UPDATE_SIGNING_KEY: ${{ secrets.MELONBANG_UPDATE_SIGNING_KEY }}
        run: |
          if [[ -z "${MELONBANG_UPDATE_SIGNING_KEY//[[:space:]]/}" ]]; then
            echo 'Set the MELONBANG_UPDATE_SIGNING_KEY repository secret.' >&2
            exit 1
          fi
          mkdir dist
          find parts -type f ! -name 'manifest.json*' -exec cp {} dist/ \;
          jq -sc 'if (map(.version) | unique | length) == 1
            then {version: .[0].version, platforms: (map(.platforms) | add)}
            else error("platform manifests name different versions") end' \
            parts/*/manifest.json > dist/manifest.json
          key="$RUNNER_TEMP/melonbang-update-signing.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$MELONBANG_UPDATE_SIGNING_KEY" > "$key"
          openssl dgst -sha256 -sign "$key" -out dist/manifest.json.sig dist/manifest.json
      # CHANGELOG.md is rewritten for every release; its heading names the
      # version and the rest becomes the release notes.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          heading=$(head -n 1 CHANGELOG.md)
          if [[ "$heading" != "# MelonBanG ${GITHUB_REF_NAME#v}" ]]; then
            echo "CHANGELOG.md is for ${heading#\# }, not ${GITHUB_REF_NAME#v}." >&2
            exit 1
          fi
          tail -n +2 CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          options=(--notes-file "$RUNNER_TEMP/notes.md" --title "MelonBanG ${GITHUB_REF_NAME#v}")
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            # Until a stable version exists, an alpha or beta is the latest
            # release, so the repository page and releases/latest show it.
            # The app picks updates by version and its channel, not by this
            # flag.
            stable=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1000 \
              --json tagName --jq '[.[].tagName | select(contains("-") | not)] | length')
            if [[ $stable -gt 0 ]]; then options+=(--prerelease); fi
          else
            options+=(--draft)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" "${options[@]}"
