name: melonbang
description: "Melonbang native desktop anime client."
publish_to: 'none'

version: 0.2.0-beta.2

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  media_kit: ^1.2.6
  # media_kit's video packages come from the melonbang branch of our fork:
  # upstream main plus the patches listed there, some offered upstream.
  media_kit_video:
    git:
      url: https://github.com/shirumesu/media-kit.git
      path: media_kit_video
      ref: 2cf310858c6c8fb782a84f41e0c4034b13c2ff99
  # Platform libraries directly, not media_kit_libs_video: the umbrella pulls
  # the hosted macOS and Windows packages, which would need overrides.
  media_kit_libs_linux: ^1.2.1
  media_kit_libs_macos_video:
    git:
      url: https://github.com/shirumesu/media-kit.git
      path: libs/macos/media_kit_libs_macos_video
      ref: 2cf310858c6c8fb782a84f41e0c4034b13c2ff99
  media_kit_libs_windows_video:
    git:
      url: https://github.com/shirumesu/media-kit.git
      path: libs/windows/media_kit_libs_windows_video
      ref: 2cf310858c6c8fb782a84f41e0c4034b13c2ff99
  file_selector: ^1.1.0
  window_manager: ^0.6.0
  tray_manager: ^0.8.2
  path_provider: ^2.1.6
  path: ^1.9.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  http: ^1.6.0
  xml: ^7.0.1
  crypto: ^3.0.7
  sqflite_common_ffi: ^2.4.2+1
  melon_libtorrent: ^0.1.1
  ffi: ^2.2.0
  protobuf: ^6.0.0
  html: ^0.15.7
  pinyin: ^3.3.0
  pointycastle: ^4.0.0
  material_color_utilities: ^0.13.0

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  config:
    enable-swift-package-manager: true
    enable-macos-arm64-only: true
  uses-material-design: true

  # Licence shipped alongside the bundled font, as the OFL requires.
  assets:
    # This version's notes for the About page.
    - CHANGELOG.md
    - assets/fonts/OFL.txt
    - assets/images/akkarin.png
    - assets/images/logotype.png
    - assets/images/mark.png
    # The Windows tray icon, a copy of the app icon.
    - assets/images/tray.ico
    # Anime4K 4.0.1 (MIT, notice in each file and assets/shaders/LICENSE).
    - assets/shaders/

  fonts:
    - family: Resource Han Rounded
      fonts:
        - asset: assets/fonts/ResourceHanRoundedCN-Regular.ttf
        - asset: assets/fonts/ResourceHanRoundedCN-Bold.ttf
          weight: 700
