name: libtorrent_flutter
description: Desktop libtorrent bindings with local disk recovery patches.
publish_to: 'none'
version: 2.0.0
homepage: https://github.com/ayman708-UX/libtorrent_flutter
repository: https://github.com/ayman708-UX/libtorrent_flutter
issue_tracker: https://github.com/ayman708-UX/libtorrent_flutter/issues
topics:
  - torrent
  - streaming
  - libtorrent
  - ffi

environment:
  sdk: ^3.10.0
  flutter: '>=3.38.0'

dependencies:
  code_assets: ^2.1.0
  ffi: ^2.1.0
  flutter:
    sdk: flutter
  hooks: ^2.2.0

dev_dependencies:
  ffigen: ^12.0.0
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      windows:
        ffiPlugin: true
  assets:
    - assets/cacert.pem
  licenses:
    - macos/licenses/boost.txt
    - macos/licenses/libtorrent.txt
    - macos/licenses/native-dependencies.txt
    - macos/licenses/openssl.txt
